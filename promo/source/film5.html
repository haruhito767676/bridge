:root{
  --bg:#000; --fg:#f5f5f7; --fg2:rgba(235,235,245,.6); --blue:#0a84ff;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:var(--display);color:var(--fg);-webkit-font-smoothing:antialiased}

.L{position:absolute;left:0;top:0;width:1920px;height:1080px}
img{display:block}
.glow{position:absolute;border-radius:50%;pointer-events:none}

/* ---------- S1 : kinetic type (film4 と同じ) ---------- */

.mk{display:inline-block;overflow:hidden;vertical-align:top;padding:.1em .03em .2em;margin:-.1em -.03em -.2em}
.c{display:inline-block;will-change:transform}
.ph{display:inline-block;width:.24em;height:1px}

.streak{position:absolute;height:3px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.75))}

#s2bg{background:linear-gradient(150deg,#0a84ff 0%,#0a84ff 36%,#3f6cf5 70%,#6a55ee 100%)}
#cam{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.dev{position:absolute}
.lid{position:absolute;left:0;top:0;background:#09090b;box-shadow:0 0 0 2.5px #7d8087,0 90px 180px rgba(0,25,140,.5),0 30px 60px rgba(0,20,100,.35)}

.tl{width:14px;height:14px;border-radius:7px;background:#ff5f57}.tl.y{background:#febc2e}.tl.g{background:#28c840}
.notion{background:#1f1f22;color:#f5f5f7}

.word{background:#fff;color:#1b1b1f}

.word .pg{margin:26px auto 0;width:760px;height:520px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.12);padding:60px 64px}

.word .pg .dec em{display:inline-block;width:3px;height:36px;background:#2b579a;vertical-align:-8px;margin-left:2px}
.slack{background:#1a1d21;color:#e8e8ea}
.slack .msg{display:flex;gap:16px;margin:22px 30px}
.slack .av{width:46px;height:46px;border-radius:9px;background:#5b8cff;flex:none}

.slack .msg .b2{height:12px;border-radius:6px;background:rgba(255,255,255,.12);margin-bottom:10px}
.pslot{position:absolute}
.panel{position:absolute;left:0;top:0;width:320px;height:600px;overflow:hidden}

.base{position:absolute}

.hl2{position:absolute;left:0;top:0;font:800 92px/1.2 var(--display);letter-spacing:-.03em;color:#fff;white-space:nowrap}

.icon>img{position:absolute;inset:0;width:100%;height:100%}
.sheen{position:absolute;inset:0;-webkit-mask:url(assets/appicon.png) center/100% 100% no-repeat;

#flash{background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(190,220,255,.4) 45%,rgba(255,255,255,0));opacity:0}
#rings{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
#grain{position:absolute;left:-60px;top:-60px;width:2040px;height:1200px;opacity:.022;pointer-events:none}

#controls button{background:#222;color:#eee;border:1px solid #444;border-radius:8px;padding:6px 14px;font:inherit;cursor:pointer}
#controls input{flex:1}
body.cap #controls{display:none}
</style>
</head>

<script>
'use strict';

const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;

}
function S(el, o) {

function chars(el, text) { el.innerHTML = [...text].map(ch => ch === '\n' ? '<br>' : `<span class="mk"><span class="c">${ch}</span></span>`).join(''); return { mk: [...el.querySelectorAll('.mk')], c: [...el.querySelectorAll('.c')] }; }

// ---------- S1 setup ----------
const W1 = chars($('w1'), 'コピー'); $('w1').insertAdjacentHTML('beforeend', '<span class="ph" id="ph1"></span>');
const W2 = chars($('w2'), 'ペースト'); $('w2').insertAdjacentHTML('beforeend', '<span class="ph" id="ph2"></span>');
const HLA = chars($('hlA'), '1つのコピーが、すべてのデバイスに。');

const TG = chars($('tag'), 'コピーは、デバイスを越えていく。');
let PD1 = [0, 0], PD2 = [0, 0];

}
const STREAKS = Array.from({ length: 16 }, (_, i) => { const d = document.createElement('div'); d.className = 'streak'; d.style.top = (120 + hash(i) * 840).toFixed(0) + 'px'; d.style.width = (500 + hash(i + 9) * 900).toFixed(0) + 'px'; $('streaks').appendChild(d); return { d, y: hash(i + 3), sp: .8 + hash(i + 5) }; });

// ================= panels (実アプリの Renderer を撮った部品画像) =================
const NS = 'http://www.w3.org/2000/svg';
function mkImg(src, parent) { const i = new Image(); i.src = src; i.decoding = 'sync'; parent.appendChild(i); return i; }

  constructor(key, parent, hero = false) {
    const m = this.m = MANIFEST[key]; this.key = key; this.hero = hero;

    const el = this.el = document.createElement('div'); el.className = 'panel ' + (key === 'win' ? 'fluent' : 'glass'); parent.appendChild(el);
    this.chromeA = mkImg(base + 'chrome.png', el); this.chromeA.style.top = '0';
    this.chromeB = hero ? mkImg(base + 'chrome-filter.png', el) : null; if (this.chromeB) { this.chromeB.style.top = '0'; this.chromeB.style.opacity = 0; }
    const v = this.view = document.createElement('div'); v.className = 'pview'; v.style.top = m.dz.top + 'px'; v.style.height = (m.dz.bottom - m.dz.top) + 'px'; el.appendChild(v);
    this.n = m.rows.map((r, i) => r.skipped ? null : { i, top: r.top, h: r.height, img: mkImg(base + `row${i}.png`, v) });
    this.sel = mkImg(base + 'new-selected.png', v); this.sel.style.opacity = 0;
    if (hero) {
      this.f = m.filter.rows.map((r, i) => ({ i, top: r.top, h: r.height, img: mkImg(base + `frow${i}.png`, v) }));
      this.sy = Array.from({ length: 11 }, (_, k) => mkImg(base + `sync${k}.png`, v)); this.sy.forEach(i => i.style.opacity = 0);
      this.syDone = mkImg(base + 'sync-done.png', v); this.syDone.style.opacity = 0;
    }

  }
  // s: { ins, sel, filt, syncIns, syncP, syncDone }
  update(s) {
    const n = this.n, top = this.dzTop, sh = n[2].top - n[1].top, HS = 68;
    const ins = s.ins == null ? 1 : s.ins, filt = s.filt || 0, syI = s.syncIns || 0;
    const mapNF = { 0: 0, 4: 1, 5: 2, 6: 3 }; // normal idx → filter idx (Mac 視点)

      if (!r) return;

      r.img.style.transform = `translate3d(0,${(y - top).toFixed(2)}px,0) scale(${sc.toFixed(4)})`;
      r.img.style.filter = blur > .2 ? `blur(${blur.toFixed(1)}px)` : '';
      if (r.i === 1) { this.sel.style.transform = r.img.style.transform; this.sel.style.opacity = (clamp(s.sel || 0) * clamp(ins * 1.5)).toFixed(3); this.sel.style.filter = r.img.style.filter; this.sel._o = o; }
    });
    if (this.hero) {
      const fe = E.inOut(filt);
      this.chromeA.style.opacity = (1 - fe).toFixed(3); this.chromeB.style.opacity = fe.toFixed(3);
      this.f.forEach((fr, i) => {
        const inNormal = Object.values(mapNF).includes(i);
        if (inNormal) { fr.img.style.opacity = 0; return; }
        fr.img.style.opacity = clamp(filt * 1.4 - .3).toFixed(3);
        fr.img.style.transform = `translate3d(0,${(fr.top - 2 - top + 14 * (1 - filt)).toFixed(2)}px,0)`;
      });

const o0 = o => o < .001 ? 0 : 1;

let PM, PI, PW, PH;
function buildPanels() {

  PH = new Panel('mac', $('hpanel'), true);
  PM.update({ ins: 0 }); PI.update({ ins: 0 }); PW.update({ ins: 0 });
  // 移動用カード (実 UI の行 = 自分のMac 由来のチップ付き)
  ['cI', 'cW'].forEach(id => { const d = document.createElement('div'); d.className = 'fcard'; d.id = id; d.innerHTML = `<img src="ui/plates/${id === 'cI' ? 'imac' : 'win'}/row1.png">`; if (id === 'cW') d.style.background = '#242428'; $('cards').appendChild(d); });
  for (let i = 0; i < 8; i++) { const d = document.createElement('div'); d.className = 'trail'; d.id = 'tr' + i; $('cards').appendChild(d); }
  const arcs = $('arcs'); ['aI', 'aW'].forEach(id => { const p = document.createElementNS(NS, 'path'); p.id = id; p.setAttribute('fill', 'none'); p.setAttribute('stroke', 'rgba(255,255,255,.85)'); p.setAttribute('stroke-width', 8); p.setAttribute('stroke-linecap', 'round'); arcs.appendChild(p); });
}

// world anchors -------------------------------------------------------------
const SC = { mac: { x: -720, y: -450 }, imac: { x: -2440, y: -430 }, win: { x: 1000, y: -430 } };
const SLOT = { mac: [1120, 150], imac: [1120, 105], win: [1120, 81] };
const rowC = (k, panel) => { const r = panel.m.rows[1]; return [SC[k].x + SLOT[k][0] + 160, SC[k].y + SLOT[k][1] + r.top + r.height / 2]; };
const VIEW = { v1: { cx: 0, cy: 0, s: 1.1 }, v2: { cx: 0, cy: 110, s: .372 }, v3: { cx: 1720, cy: -25, s: 1.1 } };
function camAt(a, b, e) { return { cx: lerp(a.cx, b.cx, e), cy: lerp(a.cy, b.cy, e), s: Math.exp(lerp(Math.log(a.s), Math.log(b.s), e)) }; }
function worldToScreen(x, y, c) { return [960 + (x - c.cx) * c.s, 540 + (y - c.cy) * c.s]; }

// ---------- rings & shake ----------
const RINGS = [[.5, 960, 540, 520], [1.95, 0, 0, 640], [4.06, 0, 0, 380], [6.24, 0, 0, 200], [6.36, 0, 0, 200], [8.32, 0, 0, 160], [13.5, 640, 540, 900], [12.3 + F, 960, 552, 1300]].map(([t0, x, y, R]) => {
  const c = document.createElementNS(NS, 'circle'); c.setAttribute('fill', 'none'); c.setAttribute('stroke', '#fff'); $('rings').appendChild(c); return { t0, x, y, R, c };
});
const SHAKES = [[.5, .35], [1.5, .5], [3.0, 1], [4.05, .3], [13.5, .8], [12.3 + F, 1.1]];
function shake(t) {
  let a = 0, ang = 0;

}

// ================== S1 / flood (film4 と同じ) ==================
const FLOOD_MAX = 74;
function s1(t) {
  if (!show($('s1'), t < 3.2)) return;
  $('g1').style.opacity = (E.out(P(t, .3, 1.4)) * (1 - E.in(P(t, 2.5, 3.0)))).toFixed(3);
  W1.c.forEach((c, i) => { const e = spring(t - .55 - i * .07, 130, 19); c.style.transform = `translate3d(0,${(115 * (1 - e)).toFixed(2)}%,0)`; c.style.opacity = P(t, .55 + i * .07, .62 + i * .07); });

}
function flood(t) {
  const el = $('flood');
  if (!show(el, t > .14 && t < 3.25)) return;

  if (t < .5) { const e = spring(t - .14, 200, 15); sx = sy = .5 * e; }
  else if (t < 1.5) {
    const p = E.out(P(t, .5, .95)), sp = Math.sin(Math.PI * P(t, .5, .95));
    x = lerp(960, PD1[0], p); y = lerp(540, PD1[1], p) - 90 * sp;

    if (t > .95) { sx = 1; sy = 1; x = PD1[0]; y = PD1[1]; }
  } else if (t < 2.75) {
    const p = E.inOut(P(t, 1.5, 1.98)), sp = Math.sin(Math.PI * p);

  el.style.transform = `translate3d(${x}px,${y}px,0) scale(${sx.toFixed(4)},${sy.toFixed(4)})`;
}

// ================== S2 : devices ==================
const CURVE = (a, b, lift) => `M${a[0]} ${a[1]} C${a[0] + (b[0] - a[0]) * .2} ${a[1] - lift}, ${a[0] + (b[0] - a[0]) * .8} ${b[1] - lift}, ${b[0]} ${b[1]}`;
const bz3 = (a, c1, c2, b, t) => { const q = 1 - t; return [q * q * q * a[0] + 3 * q * q * t * c1[0] + 3 * q * t * t * c2[0] + t * t * t * b[0], q * q * q * a[1] + 3 * q * q * t * c1[1] + 3 * q * t * t * c2[1] + t * t * t * b[1]]; };
function press(el, t, t0, hold) { // キートップを押す
  const d = t - t0, on = d > 0 && d < hold ? 1 : 0;
  el.style.transform = `translate3d(0,${(on * 8).toFixed(1)}px,0) scale(${(1 - .04 * on).toFixed(3)})`;
  el.style.boxShadow = on ? 'inset 0 1.5px 0 rgba(255,255,255,.16),inset 0 -2px 0 rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.4),0 0 0 3px rgba(10,132,255,.95),0 0 50px rgba(10,132,255,.6)' : '';
}

  // ---- Mac rise ----

  S($('devWin'), { o: E.out(P(t, 4.6, 5.2)) });
  // ---- Mac: select + copy ----
  $('selHl').style.transform = `scaleX(${E.out(P(t, 3.45, 3.78)).toFixed(4)})`;
  const c1 = worldToScreen(0, 0, camAt(VIEW.v1, VIEW.v1, 0));

  PM.update({ ins: insM });
  // ---- Cards: Mac → iMac / Win ----

  const flights = [{ id: 'cI', to: B, t0: 5.5, t1: 6.2, arc: 'aI', panel: PI, lift: -470 }, { id: 'cW', to: Cc, t0: 5.6, t1: 6.32, arc: 'aW', panel: PW, lift: -470 }];
  flights.forEach((f, k) => {
    const card = $(f.id), tt = t, pf = E.inOut(P(tt, f.t0, f.t1)), pop = E.out(P(tt, f.t0 - .16, f.t0 + .1)), land = E.in(P(tt, f.t1 - .02, f.t1 + .22));
    const vis = tt > f.t0 - .16 && tt < f.t1 + .25;

    const c1_ = [A[0] + (f.to[0] - A[0]) * .2, A[1] + f.lift], c2_ = [A[0] + (f.to[0] - A[0]) * .8, f.to[1] + f.lift];
    const pos = bz3(A, c1_, c2_, f.to, pf);

    }

    arc.setAttribute('d', `M${A[0]} ${A[1]} C${c1_[0]} ${c1_[1]}, ${c2_[0]} ${c2_[1]}, ${f.to[0]} ${f.to[1]}`);
    arc.setAttribute('pathLength', 1); arc.style.strokeDasharray = '1 1';
    const dr = E.inOut(P(tt, f.t0 - .1, f.t1)), fa = 1 - E.in(P(tt, f.t1 + .1, f.t1 + .7));

  const top = t < 4.5 ? '自分のMac' : t > 7.6 ? '会社用PC' : '';

  const chO = (E.out(P(t, 3.55, 3.85)) * (1 - E.in(P(t, 4.55, 4.85)))) + (E.out(P(t, 7.7, 8.0)) * (1 - E.in(P(t, 9.2, 9.5))));
  $('chipTop').style.opacity = clamp(chO).toFixed(3);

  {
    const tgt = [SLOT.win[0] + 200, SLOT.win[1] + PW.m.rows[1].top + 30];

    cur.style.opacity = P(t, 7.75, 7.9) * (1 - E.in(P(t, 9.0, 9.3)));
  }
  keysAnim($('keysW'), 960, 850, t, 8.55, 9.15);
  press($('kW0'), t, 8.7, .16); press($('kW1'), t, 8.74, .16);
  const pasted = t > 8.86;
  const words = pasted ? '明日14時、会議室Bでキックオフ' : '';
  if ($('pasteWords')._v !== words) { $('pasteWords').textContent = words; $('pasteWords')._v = words; }
  $('pasteHl').style.opacity = pasted ? (.9 * (1 - P(t, 8.95, 9.5))).toFixed(3) : 0;
  $('pasteCaret').style.opacity = (Math.floor(t * 2.4) % 2 === 0 || pasted) ? 1 : 0;
  // ---- sky glows ----
  $('s2gA').style.transform = `translate3d(${(-c.cx * .02 + 40 * Math.sin(t * .8)).toFixed(1)}px,${(20 * Math.sin(t * .6)).toFixed(1)}px,0)`;
  $('s2gB').style.transform = `translate3d(${(c.cx * -.015).toFixed(1)}px,${(30 * Math.sin(t * .7 + 1)).toFixed(1)}px,0)`;
  hero(t);
  el.style.filter = fadeAll < .98 ? `blur(${(18 * (1 - fadeAll)).toFixed(1)}px)` : '';
  el.style.opacity = (P(t, 2.95, 3.25) * fadeAll).toFixed(3);
}

// ================== hero panel (実 UI を大きく) ==================
function hero(t) {
  const h = $('hero');
  const on = t > 9.45 && t < 13.5;
  if (!show(h, on)) return;
  const e = spring(t - 9.55, 100, 17), ex = E.in(P(t, 13.05, 13.4));
  const HS = 1.62, px = 1090, py = 54; // 画面上の位置

  S($('hpanel'), { x: px + 260 * (1 - e) + 60 * ex, y: py + 20 * (1 - e), s: HS * (.86 + .14 * e), o: P(t, 9.55, 9.8) * (1 - ex), blur: 16 * (1 - E.out(P(t, 9.55, 10.1))) + 18 * ex });
  const filt = E.inOut(P(t, 10.62, 11.08)) * (1 - E.inOut(P(t, 11.6, 12.0)));

  HLC.c.forEach((ch, i) => { const e1 = spring(t - tC[0] - i * .035, 130, 19), d = E.in(P(t, 13.02 + i * .012, 13.02 + i * .012 + .3)); ch.style.transform = `translate3d(0,${(115 * (1 - e1) + 135 * d).toFixed(2)}%,0)`; ch.style.opacity = P(t, tC[0] + i * .035, tC[0] + .07 + i * .035); });
  const a = $('hlB'), c2 = $('hlC');
  a.style.left = '150px'; a.style.top = '360px'; c2.style.left = '150px'; c2.style.top = '360px';
  show(a, t < 11.7); show(c2, t > 11.7);

    const tgt = [px + HS * 92, py + HS * 128]; // 見積書の行の出身チップ付近 (Mac 視点 row4 → 見積書)
    const r4 = PH.n[4], chipY = py + HS * (r4.top + 50), chipX = px + HS * 130;

// ================== S5 : “0” ==================
const ZX = 640;

  b.style.opacity = E.out(P(t, 13.1, 13.4)).toFixed(3);

  else { const r = lerp(1700, 14, E.inOut(P(t, 14.4, 14.83))); b.style.clipPath = `circle(${r.toFixed(1)}px at ${ZX}px 540px)`; }
  const s5el = $('s5'); show(s5el, t > 13.3 && t < 14.7);
  const z = spring(t - 13.5, 110, 13), fadeC = 1 - E.in(P(t, 14.4, 14.6));
  S($('zero'), { pre: 'translate(-50%,-50%) ', s: .55 + .45 * z, o: P(t, 13.5, 13.62) * fadeC, blur: 22 * (1 - E.out(P(t, 13.5, 13.9))) });
  S($('z1'), { y: 40 * (1 - E.out(P(t, 13.6, 14.05))), o: E.out(P(t, 13.6, 13.85)) * fadeC, blur: 12 * (1 - E.out(P(t, 13.6, 14.0))) });
  S($('z2'), { y: 40 * (1 - E.out(P(t, 13.72, 14.15))), o: E.out(P(t, 13.72, 13.97)) * fadeC, blur: 12 * (1 - E.out(P(t, 13.72, 14.1))) });
  $('zstrike').style.width = (E.out(P(t, 13.95, 14.22)) * 108).toFixed(1) + '%';

// ================== S4 : bridge (film4 と同じ。時間だけ F ぶん後ろ) ==================
const archLen = $('arch').getTotalLength();
const dLen = 286, hLen = [134, 168, 134];
(function buildArch() {
  const N = 90, up = [], dn = [], L = archLen, arch = $('arch');
  for (let i = 0; i <= N; i++) {
    const l = L * i / N, p = arch.getPointAtLength(l), a = arch.getPointAtLength(Math.max(0, l - .5)), b = arch.getPointAtLength(Math.min(L, l + .5));
    let tx = b.x - a.x, ty = b.y - a.y; const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const hw = (17 + 19 * Math.pow(Math.sin(Math.PI * i / N), .7)) / 2;
    up.push([p.x - ty * hw, p.y + tx * hw]); dn.push([p.x + ty * hw, p.y - tx * hw]);
  }
  const pts = up.concat(dn.reverse());
  const c0 = arch.getPointAtLength(0), c1 = arch.getPointAtLength(L);
  $('archFill').setAttribute('d', 'M' + pts.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' L') + ` Z M${c0.x - 8.5} ${c0.y} a8.5 8.5 0 1 0 17 0 a8.5 8.5 0 1 0 -17 0 M${c1.x - 8.5} ${c1.y} a8.5 8.5 0 1 0 17 0 a8.5 8.5 0 1 0 -17 0`);
})();
const IC = { ox: 960, oy: 330, s: 3, ty: 210, bx: 790, by: 160, k: 340 / 1024 };
function iconToScreen(ux, uy) { return [IC.ox + IC.s * (IC.bx - IC.ox + ux * IC.k), IC.oy + IC.ty + IC.s * (IC.by - IC.oy + uy * IC.k)]; }
function s4(t) { // t は F を引いた「film4 の時間」
  if (!show($('s4'), t > 10.35)) return;
  const arch = $('arch'), ag = $('archGlow');
  const approach = E.inOut(P(t, 10.42, 10.88));
  const draw = E.inOut(P(t, 10.88, 11.75));
  const st = iconToScreen(217, 542);
  let px, py;
  if (t < 10.88) { px = lerp(ZX, st[0], approach); py = lerp(540, st[1], approach) - 60 * Math.sin(Math.PI * approach); }
  else { const pt = arch.getPointAtLength(draw * archLen); [px, py] = iconToScreen(pt.x, pt.y); }
  const pen = $('pen');
  const penO = P(t, 10.38, 10.5) * (1 - E.in(P(t, 11.72, 11.95)));
  pen.style.transform = `translate3d(${px.toFixed(1)}px,${py.toFixed(1)}px,0) scale(${(0.9 + .5 * Math.sin(Math.PI * draw)).toFixed(3)})`;
  pen.style.opacity = penO.toFixed(3); show(pen, penO > .01);
  const dash = (el, len, p) => { el.style.strokeDasharray = len; el.style.strokeDashoffset = (len * (1 - p)).toFixed(2); el.style.opacity = p > 0 ? 1 : 0; };
  dash($('archM'), archLen, draw); dash(ag, archLen, draw); $('archM').style.opacity = 1;
  const dk = E.out(P(t, 11.45, 11.95));
  const dm = clamp(dk / .72), dO = clamp((dk - .72) / .28);
  dash($('deckLm'), 212, dm); dash($('deckRm'), 212, dm); dash($('deckLo'), 76, dO); dash($('deckRo'), 76, dO);
  document.querySelectorAll('.hang').forEach((h, i) => dash(h, hLen[i], E.out(P(t, 11.7 + i * .07, 12.05 + i * .07))));
  const pr = E.out(P(t, 11.95, 12.3));
  $('piers').style.opacity = pr; $('piers').style.transform = `translate3d(0,${(20 * (1 - pr)).toFixed(1)}px,0)`;
  $('glowG').style.opacity = (.85 * (1 - E.in(P(t, 12.3, 12.7)))).toFixed(3);
  $('icPng').style.opacity = P(t, 12.28, 12.42);
  $('glyph').style.opacity = 1 - P(t, 12.3, 12.4);
  const settle = E.inOut(P(t, 12.32, 13.1));
  const ic = $('ic4');
  const kick = t > 12.3 ? 1 + .04 * Math.exp(-(t - 12.3) * 8) * Math.cos((t - 12.3) * 40) : 1;
  ic.style.transform = `translate3d(0,${lerp(IC.ty, 0, settle).toFixed(2)}px,0) scale(${(lerp(IC.s, 1, settle) * kick).toFixed(4)})`;
  ic.style.opacity = P(t, 10.4, 10.5) > 0 ? 1 : 0;
  $('sh4').style.backgroundPosition = `${lerp(100, 0, E.inOut(P(t, 13.15, 14.15)))}% 0`;
  $('sh4').style.opacity = t > 13.1 ? 1 : 0;
  $('g4').style.opacity = E.out(P(t, 11.2, 12.4)).toFixed(3);
  $('flash').style.opacity = (t > 12.28 ? Math.exp(-(t - 12.28) * 7) : 0).toFixed(3);
  BR.c.forEach((ch, i) => { const e = spring(t - 12.78 - i * .045, 120, 18); ch.style.transform = `translate3d(0,${(118 * (1 - e)).toFixed(2)}%,0)`; ch.style.opacity = P(t, 12.78 + i * .045, 12.85 + i * .045); });
  TG.c.forEach((ch, i) => { const e = E.out(P(t, 13.3 + i * .022, 13.85 + i * .022)); ch.style.transform = `translate3d(0,${(40 * (1 - e)).toFixed(2)}px,0)`; ch.style.opacity = e; ch.style.filter = e < .98 ? `blur(${(8 * (1 - e)).toFixed(1)}px)` : ''; });
}

function rings(t) {
  RINGS.forEach((r, i) => {
    const d = t - r.t0, on = d > 0 && d < 1.1;
    if (!on) { r.c.style.display = 'none'; return; }
    r.c.style.display = '';
    let x = r.x, y = r.y;
    if (i === 1) { x = PD2[0]; y = PD2[1]; }
    if (i === 2) { [x, y] = worldToScreen(...rowC('mac', PM), { cx: 0, cy: 0, s: 1.1 }); }
    if (i === 3) { [x, y] = worldToScreen(...rowC('imac', PI), VIEW.v2); }
    if (i === 4) { [x, y] = worldToScreen(...rowC('win', PW), VIEW.v2); }
    if (i === 5) { [x, y] = worldToScreen(...rowC('win', PW), VIEW.v3); }
    const p = E.out(P(d, 0, 1.0));
    r.c.setAttribute('cx', x); r.c.setAttribute('cy', y); r.c.setAttribute('r', (r.R * p).toFixed(1));
    r.c.setAttribute('stroke-width', (6 * (1 - p) + 1).toFixed(2)); r.c.setAttribute('stroke-opacity', (.75 * (1 - p) ** 1.5).toFixed(3));
  });
}

const gctx = $('grain').getContext('2d');
{ const id = gctx.createImageData(680, 400); for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } gctx.putImageData(id, 0, 0); }

function renderAt(t) {
  t = clamp(t, 0, DUR - 1e-6);
  s1(t); flood(t); s2(t); s5(t); s4(t - F); rings(t);
  const sk = shake(t), w = $('world');
  w.style.transform = `translate3d(${sk.x.toFixed(2)}px,${sk.y.toFixed(2)}px,0) rotate(${sk.r.toFixed(3)}deg) scale(${sk.s.toFixed(4)})`;
  const f = Math.floor(t * 60);
  $('grain').style.transform = `translate3d(${(hash(f) * 60).toFixed(0)}px,${(hash(f + 77) * 60).toFixed(0)}px,0)`;
  $('fade').style.opacity = Math.max(1 - P(t, 0, .12), E.in(P(t, 18.9, 19.35))).toFixed(3);
}
window.renderAt = renderAt;

async function warm() {
  buildPanels();
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  await document.fonts.ready;
  measure(); renderAt(0);
}
window.__ready = warm().then(() => true);

if (CAP) document.body.classList.add('cap');
else {
  const stage = $('stage');
  const fit = () => { const s = Math.min(innerWidth / W, (innerHeight - 50) / H); stage.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - 50 - H * s) / 2}px) scale(${s})`; };
  addEventListener('resize', fit); fit();
  let playing = true, t0 = performance.now(), cur = 0;
  const btn = $('play'), scrub = $('scrub'), lab = $('tlabel');
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? '❚❚' : '▶'; t0 = performance.now() - cur * 1000; };
  scrub.oninput = () => { cur = +scrub.value; t0 = performance.now() - cur * 1000; renderAt(cur); lab.textContent = cur.toFixed(3) + 's'; };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); btn.click(); } });
  window.__ready.then(() => { t0 = performance.now(); const loop = () => { if (playing) { cur = ((performance.now() - t0) / 1000) % DUR; renderAt(cur); scrub.value = cur; lab.textContent = cur.toFixed(3) + 's'; } requestAnimationFrame(loop); }; loop(); });
}

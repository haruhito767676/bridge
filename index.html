<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: file:; style-src 'self'" />
  <title>Bridge</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ウインドウは右端に固定したまま「幅」だけがスプリングで変わる。
       #root を右寄せの固定幅にしておくことで、幅が縮んでも中身は再レイアウトされず
       左側から自然に隠れていく (つまみだけが最後まで残る) -->
  <div id="root">
  <div id="shell">
    <!-- 検索フィールド + 種別セグメント (すべて / ファイル / クリップ)。
         Mail.app のメールボックスフィルタと同じ、見えるボタンで切り替える方式 -->
    <div id="search-area">
      <div id="search-field">
        <input id="search-bar" type="search" placeholder="検索"
               spellcheck="false" autocomplete="off" aria-label="アイテムを検索" />
      </div>
      <div id="filter-segment" role="tablist" aria-label="種別で絞り込み">
        <!-- 選択中インジケーター。macOS ではボタン間をスプリングで滑らせ、iOS/最近の macOS の
             セグメントコントロールと同じ質感にする。Windows は Fluent の Pivot (下線が瞬時に切り替わる)
             に寄せているのでこの要素ごと非表示にする -->
        <div id="filter-segment-thumb" aria-hidden="true"></div>
        <button type="button" class="segment-item active" data-mode="" role="tab" aria-selected="true">すべて</button>
        <button type="button" class="segment-item" data-mode="file" role="tab" aria-selected="false">ファイル</button>
        <button type="button" class="segment-item" data-mode="clip" role="tab" aria-selected="false">クリップ</button>
      </div>
      <!-- デバイス絞り込み中だけ出るチップ (右クリックの「◯◯のアイテムだけ表示」から入る)。
           種別セグメントと同じ「今何を見ているか」の並びに置き、footer は状態表示専用に保つ -->
      <span id="device-filter-chip" hidden>
        <span id="device-filter-text"></span>
        <button id="device-filter-clear" aria-label="絞り込みを解除" tabindex="-1">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>
        </button>
      </span>
    </div>

    <div id="drop-zone" tabindex="0">
      <!-- 空のときのプレースホルダ -->
      <div id="empty-state">
        <svg id="drop-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M24 6v22" />
          <path d="M16 20l8 8 8-8" />
          <path d="M6 30v6a4 4 0 0 0 4 4h28a4 4 0 0 0 4-4v-6" />
          <path d="M6 30h10l3 4h10l3-4h10" />
        </svg>
        <p class="empty-label">ここにファイルをドロップ</p>
        <p class="empty-sub">コピーした内容も自動で並びます</p>
      </div>

      <!-- アイテムのリスト (日付セクション見出しを含む) -->
      <ul id="file-list" role="listbox" aria-label="アイテム" aria-multiselectable="true"></ul>
    </div>

    <footer id="shelf-footer">
      <div class="footer-status">
        <span id="sync-dot" class="sync-dot" hidden></span>
        <span id="item-count"></span>
        <span id="pause-label" class="pause-label" hidden></span>
      </div>
      <div class="footer-actions">
        <button id="clear-button" class="footer-button" hidden>すべて消去</button>
        <button id="sync-pause-button" class="footer-button" aria-label="同期を一時停止" aria-pressed="false" title="ほかのデバイスとの同期を一時停止">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <button id="settings-button" class="footer-button" aria-label="設定">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </footer>

    <!-- 右クリックのコンテキストメニュー (renderer.js が中身を組み立てる) -->
    <ul id="context-menu" role="menu" hidden></ul>

    <!-- 設定シート。1 ページ目 = つなぐ / 使いかた / このアプリ、2 ページ目 = 詳細設定 (困ったときの項目)。
         変更は入力を確定した時点で自動保存する (保存ボタンはない) -->
    <section id="settings-sheet" hidden aria-label="設定">
      <div class="sheet-header">
        <button id="settings-back" class="footer-button" aria-label="戻る">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
          <span id="settings-back-label">戻る</span>
        </button>
        <span class="sheet-title" id="settings-title">設定</span>
        <span class="sheet-spacer"></span>
      </div>

      <div class="sheet-body" id="settings-page-main">
        <div class="set-status" id="setting-status">
          <span class="set-dot" id="setting-status-dot"></span>
          <div class="set-status-text">
            <b id="setting-status-title">つながっているデバイスはありません</b>
            <small id="setting-status-sub" hidden></small>
          </div>
          <button id="setting-scan" class="push-button" type="button">いま探す</button>
        </div>

        <div class="set-caption">つなぐ</div>
        <div class="set-group">
          <label class="set-row" for="setting-device-name">
            <span>このデバイスの名前</span>
            <input id="setting-device-name" class="set-inline" type="text" spellcheck="false" autocomplete="off" title="ほかのデバイスに届いたアイテムに、この名前が表示されます" />
          </label>
          <div class="set-row">
            <label for="setting-token">同期キー</label>
            <input id="setting-token" class="set-key" type="text" spellcheck="false" autocomplete="off" />
            <span class="set-btns">
              <button id="setting-token-copy" class="push-button" type="button">コピー</button>
              <button id="setting-token-paste" class="push-button" type="button">貼り付け</button>
            </span>
          </div>
        </div>

        <div class="set-caption">使いかた</div>
        <div class="set-group">
          <div class="set-row">
            <span>開く / 閉じる</span>
            <span class="set-hotkey">
              <button id="setting-hotkey-toggle" class="hotkey-field" type="button" title="クリックして、押したいキーを押します"></button>
              <button id="setting-hotkey-toggle-reset" class="footer-button" type="button" title="既定に戻す"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a5 5 0 1 1 1.6 3.7M3 8V4M3 8h4"/></svg></button>
            </span>
          </div>
          <div class="set-row">
            <span>クイックペースト</span>
            <span class="set-hotkey">
              <button id="setting-hotkey-paste" class="hotkey-field" type="button" title="クリックして、押したいキーを押します"></button>
              <button id="setting-hotkey-paste-reset" class="footer-button" type="button" title="既定に戻す"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a5 5 0 1 1 1.6 3.7M3 8V4M3 8h4"/></svg></button>
            </span>
          </div>
          <div class="set-row">
            <label for="setting-autopaste">クイックペーストで自動貼り付け</label>
            <input id="setting-autopaste" class="switch" type="checkbox" />
          </div>
          <div class="set-row">
            <label for="setting-sourceapp">コピー元のアイコンを表示</label>
            <input id="setting-sourceapp" class="switch" type="checkbox" />
          </div>
        </div>

        <div class="set-caption">このアプリ</div>
        <div class="set-group">
          <div class="set-row">
            <label for="setting-login">ログイン時に起動</label>
            <input id="setting-login" class="switch" type="checkbox" />
          </div>
          <div class="set-row">
            <span id="setting-version"></span>
            <button id="setting-check-update" class="push-button" type="button">更新を確認</button>
          </div>
          <button id="setting-open-advanced" class="set-row set-link" type="button"><span>詳細設定</span><svg class="set-chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg></button>
        </div>
      </div>

      <div class="sheet-body" id="settings-page-advanced" hidden>
        <div class="set-caption">見つけかた</div>
        <div class="set-group">
          <div class="set-row">
            <label for="setting-autoscan">同じネットワークを自動で探す</label>
            <input id="setting-autoscan" class="switch" type="checkbox" />
          </div>
          <div class="set-row set-col">
            <label for="setting-peers">手動で追加 (IP アドレス、1 行に 1 つ)</label>
            <textarea id="setting-peers" class="text-field text-area" rows="2" spellcheck="false" placeholder="192.168.1.21"></textarea>
          </div>
        </div>

        <div class="set-caption">接続中のデバイス</div>
        <ul id="setting-peer-list" class="peer-list"></ul>

        <div class="set-caption">そのほか</div>
        <div class="set-group">
          <div class="set-row set-col"><span>履歴の使用状況</span><span id="setting-history-usage" class="set-val"></span></div>
          <button id="setting-log" class="set-row set-link" type="button"><span>ログを表示</span><svg class="set-chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg></button>
        </div>
      </div>
    </section>

    <!-- クリアの取り消しなどの短命な通知 -->
    <div id="control-toast" hidden role="status">
      <span id="control-toast-icon" class="toast-icon"></span>
      <span class="toast-text">
        <span id="control-toast-title" class="toast-title"></span>
        <span id="control-toast-sub" class="toast-sub"></span>
      </span>
      <button id="control-toast-action" class="toast-action" hidden></button>
    </div>
  </div>

  <!-- 隠れているときに画面端 (= ウインドウの右端) に残る「つまみ」。
       #root は右寄せなので、格納して幅 15px になったときに見えるのはこの要素になる -->
  <div id="handle" role="button" aria-label="Bridge を開く"></div>
  </div>

  <script src="lib/format.js"></script>
  <script src="renderer.js"></script>
</body>
</html>

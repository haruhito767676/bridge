<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: file:; style-src 'self'" />
  <title>Bridge</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 隠れているときに画面端に残る「つまみ」。ホバー/ドラッグ進入でシェルターが開く -->
  <div id="handle"></div>

  <div id="shell">
    <!-- frame: false のためネイティブタイトルバーは無し。ウインドウのドラッグ移動領域を兼ねる -->
    <header id="titlebar">Bridge</header>

    <!-- スマート検索バー。
         「:」入力で file / clip のサジェストが浮き出し、Tab / Enter でテキストバッジとして
         左端に吸着 → バッジで種別を絞りつつ続けてキーワード検索できる -->
    <div id="search-area">
      <div id="search-field">
        <span id="filter-badge" hidden>
          <span id="filter-badge-label"></span>
          <button id="filter-badge-remove" title="フィルターを解除" tabindex="-1">×</button>
        </span>
        <input id="search-bar" type="search" placeholder="アイテムを検索 ・「:」で絞り込み"
               spellcheck="false" autocomplete="off" />
      </div>
      <ul id="search-suggest" hidden></ul>
    </div>

    <div id="drop-zone">
      <!-- 空のときのプレースホルダ -->
      <div id="empty-state">
        <svg id="drop-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M24 8v20" />
          <path d="M15 20l9 9 9-9" />
          <path d="M8 32v4a4 4 0 0 0 4 4h24a4 4 0 0 0 4-4v-4" />
        </svg>
        <p class="empty-label">ここにファイルをドロップ</p>
        <p class="empty-sub">⌘Cでコピーした内容も自動で並びます</p>
      </div>

      <!-- ドロップされたファイルのリスト -->
      <ul id="file-list"></ul>
    </div>

    <footer id="shelf-footer">
      <span id="item-count"></span>
      <button id="clear-button" title="すべてクリア">クリア</button>
    </footer>

    <!-- 外部からのファイル/テキストのドラッグ進入時だけ最前面に現れるドロップエリア -->
    <div id="drop-overlay">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 8v20" />
        <path d="M15 20l9 9 9-9" />
        <path d="M8 32v4a4 4 0 0 0 4 4h24a4 4 0 0 0 4-4v-4" />
      </svg>
      <p>ここにドロップして追加</p>
    </div>

    <!-- クリアの取り消しなどの短命な通知。
         用途ごとに文言・色・アクションボタンの有無を JS 側から差し替えて使い回す -->
    <div id="control-toast" hidden>
      <span id="control-toast-icon" class="toast-icon"></span>
      <span class="toast-text">
        <span id="control-toast-title" class="toast-title"></span>
        <span id="control-toast-sub" class="toast-sub"></span>
      </span>
      <button id="control-toast-action" class="toast-action" hidden></button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>

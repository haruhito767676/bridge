name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
          - os: windows-latest
            script: build:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Apple Developer 証明書を用意するまでは未署名でビルドする。
      # CSC_IDENTITY_AUTO_DISCOVERY=false にしないと、CI ランナー上に
      # 署名用の keychain が無いことで electron-builder がエラー終了する。
      # electron-builder はタグのビルドで、既定で GitHub へ「公開」まで行おうとして、
      # GH_TOKEN が無いと失敗する。公開は下の release ジョブ (action-gh-release) に任せるので、
      # ここではビルドだけにする (--publish never)。
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**/*
          generate_release_notes: true
